[workspace]
members = [
    "raeva",
    "rv-config",
    "rv-export",
    "rv-fs",
    "rv-http",
    "rv-lock",
    "rv-maven-model",
    "rv-maven-types",
    "rv-repo",
    "rv-resolver",
    "rv-sbom",
    "rv-store",
    "rv-test-support",
    "rv-vuln",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
authors = ["Raeva"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/raeva-io/raeva"
homepage = "https://raeva.io"
keywords = ["maven", "lockfile", "java"]
categories = ["development-tools"]

[workspace.dependencies]
# Workspace crates
rv-config = { path = "rv-config", version = "0.5.0" }
rv-export = { path = "rv-export", version = "0.5.0" }
rv-fs = { path = "rv-fs", version = "0.5.0" }
rv-http = { path = "rv-http", version = "0.5.0" }
rv-lock = { path = "rv-lock", version = "0.5.0" }
rv-maven-model = { path = "rv-maven-model", version = "0.5.0" }
rv-maven-types = { path = "rv-maven-types", version = "0.5.0" }
rv-repo = { path = "rv-repo", version = "0.5.0" }
rv-resolver = { path = "rv-resolver", version = "0.5.0" }
rv-sbom = { path = "rv-sbom", version = "0.5.0" }
rv-store = { path = "rv-store", version = "0.5.0" }
rv-test-support = { path = "rv-test-support" }
rv-vuln = { path = "rv-vuln", version = "0.5.0" }

# Third-party dependencies (alphabetical)
aes = "0.8"
anyhow = "1.0"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
base64 = "0.22"
bytes = "1.11"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
console = { version = "0.16", default-features = false, features = ["std"] }
criterion = { version = "0.5", features = ["html_reports"] }
cvss = "3"
derive_more = { version = "1.0", features = ["deref", "display"] }
dirs = "7.0"
dunce = "1.0"
fancy-regex = "0.18"
fastrand = "2"
foldhash = "0.2"
fs4 = { version = "1.1", default-features = false }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.3"
h2 = "0.4"
hex = "0.4"
http = "1"
httpdate = "1"
indexmap = { version = "2.12", features = ["serde"] }
indicatif = "0.18"
jsonschema = { version = "=0.48.2", default-features = false }
lru = "0.18"
md-5 = "0.10"
owo-colors = "4"
packageurl = "0.7"
pathdiff = "0.2"
petgraph = "0.8"
quick-xml = { version = "0.41", features = ["serialize"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls-no-provider", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
spdx = "0.13.4"
strum = { version = "0.28", features = ["derive"] }
tabled = { version = "0.17", default-features = false, features = ["std"] }
temp-env = "0.3"
same-file = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.48"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# raeva and rv-test-support are not used as libraries and allow
# missing_docs in their crate roots.
[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
