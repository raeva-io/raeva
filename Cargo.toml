[workspace]
members = [
    "rv-cli",
    "rv-config",
    "rv-maven-model",
    "rv-repo",
    "rv-resolver",
    "rv-store",
    "rv-version",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Raeva"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/raeva-io/raeva"
homepage = "https://raeva.io"

[workspace.dependencies]
# Workspace crates
rv-config = { path = "rv-config", version = "0.1.1" }
rv-maven-model = { path = "rv-maven-model", version = "0.1.1" }
rv-repo = { path = "rv-repo", version = "0.1.1" }
rv-resolver = { path = "rv-resolver", version = "0.1.1" }
rv-store = { path = "rv-store", version = "0.1.1" }
rv-version = { path = "rv-version", version = "0.1.1" }

# Third-party dependencies (alphabetical)
aes = "0.8"
anyhow = "1.0"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
base64 = "0.22"
bytes = "1.11"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
criterion = { version = "0.5", features = ["html_reports"] }
derive_more = { version = "1.0", features = ["as_ref", "deref", "display", "from"] }
dirs = "6.0"
dunce = "1.0"
fs2 = "0.4"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
indexmap = { version = "2.12", features = ["serde"] }
indicatif = "0.17"
lru = "0.12"
owo-colors = "4"
pathdiff = "0.2"
petgraph = "0.8"
quick-xml = { version = "0.38", features = ["serialize"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
subtle = "2.5"
tabled = "0.17"
temp-env = "0.3"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"
