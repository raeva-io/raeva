[licenses]
# r-efi is also offered under LGPL-2.1-or-later; the MIT and Apache-2.0
# options satisfy this list.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# chrono has no maintained release and no known flaw. raeva uses it for
# the system zone's offsets, which come from the OS's tz data, and to parse
# and format timestamps; replacing it is planned for 0.7.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no replacement release and no known flaw; replacing it is planned for 0.7" },
]
