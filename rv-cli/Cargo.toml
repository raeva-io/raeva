[[bin]]
name = "rv"
path = "src/bin/rv.rs"

[package.metadata.dist]
dist = true
display-name = "Raeva"
formula = "rv"
install-success-msg = "rv is installed. Run 'rv --help' to get started."

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rv-cli-{ target }{ archive-suffix }"
bin-dir = "rv-cli-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.wix]
upgrade-guid = "669B33CA-33F8-40D6-BDFA-291F8F8C54C8"
