[package]
name = "rv-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dependency resolution for Raeva"
readme = "README.md"
documentation = "https://docs.rs/rv-resolver"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/", "benches/"]

[lints]
workspace = true

[dependencies]
rv-config.workspace = true
rv-fs.workspace = true
rv-http.workspace = true
rv-lock.workspace = true
rv-maven-model.workspace = true
rv-maven-types.workspace = true
rv-repo.workspace = true
rv-store.workspace = true

bytes.workspace = true
foldhash.workspace = true
futures.workspace = true
indexmap.workspace = true
lru.workspace = true
petgraph.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
reqwest.workspace = true
rv-config = { workspace = true, features = ["testing"] }
rv-repo = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["net", "test-util"] }
rv-test-support.workspace = true
rustls.workspace = true
tempfile.workspace = true
