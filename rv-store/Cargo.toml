[package]
name = "rv-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressed storage for Raeva"
readme = "README.md"
documentation = "https://docs.rs/rv-store"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/", "benches/"]

[lints]
workspace = true

[dependencies]
rv-fs.workspace = true
rv-maven-types.workspace = true

anyhow.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
rusqlite.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
